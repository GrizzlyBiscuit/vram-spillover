<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400">
  <rect width="700" height="400" fill="#1a1a2e"/>
  <text x="350" y="30" text-anchor="middle" fill="#eaeaea" font-size="18" font-weight="bold">Proof: tokens before and after handoff</text>

  <!-- Bars for each run -->
  <!-- proof: 49 + 249 -->
  <rect x="80" y="120" width="60" height="120" fill="#e94560"/>
  <rect x="150" y="60" width="60" height="180" fill="#0f3460"/>
  <text x="110" y="110" text-anchor="middle" fill="#eaeaea" font-size="12">49</text>
  <text x="180" y="50" text-anchor="middle" fill="#eaeaea" font-size="12">249</text>
  <text x="145" y="300" text-anchor="middle" fill="#eaeaea" font-size="12">proof</text>

  <!-- repeat1: 67 + 553 -->
  <rect x="280" y="80" width="60" height="160" fill="#e94560"/>
  <rect x="350" y="30" width="60" height="210" fill="#0f3460"/>
  <text x="310" y="70" text-anchor="middle" fill="#eaeaea" font-size="12">67</text>
  <text x="380" y="20" text-anchor="middle" fill="#eaeaea" font-size="12">553</text>
  <text x="345" y="300" text-anchor="middle" fill="#eaeaea" font-size="12">repeat1</text>

  <!-- repeat2: 68 + 553 -->
  <rect x="480" y="80" width="60" height="160" fill="#e94560"/>
  <rect x="550" y="30" width="60" height="210" fill="#0f3460"/>
  <text x="510" y="70" text-anchor="middle" fill="#eaeaea" font-size="12">68</text>
  <text x="580" y="20" text-anchor="middle" fill="#eaeaea" font-size="12">553</text>
  <text x="545" y="300" text-anchor="middle" fill="#eaeaea" font-size="12">repeat2</text>

  <!-- control: 657 -->
  <rect x="640" y="30" width="40" height="210" fill="#533483"/>
  <text x="660" y="20" text-anchor="middle" fill="#eaeaea" font-size="12">657</text>
  <text x="660" y="300" text-anchor="middle" fill="#eaeaea" font-size="12">control</text>

  <!-- Handoff marks -->
  <line x1="110" y1="240" x2="110" y2="250" stroke="#fff" stroke-width="2"/>
  <text x="110" y="265" text-anchor="middle" fill="#fff" font-size="10">49</text>

  <line x1="310" y1="240" x2="310" y2="250" stroke="#fff" stroke-width="2"/>
  <text x="310" y="265" text-anchor="middle" fill="#fff" font-size="10">67</text>

  <line x1="510" y1="240" x2="510" y2="250" stroke="#fff" stroke-width="2"/>
  <text x="510" y="265" text-anchor="middle" fill="#fff" font-size="10">68</text>

  <!-- Legend -->
  <rect x="80" y="340" width="20" height="12" fill="#e94560"/>
  <text x="110" y="351" fill="#eaeaea" font-size="11">Before handoff (primary)</text>
  <rect x="280" y="340" width="20" height="12" fill="#0f3460"/>
  <text x="310" y="351" fill="#eaeaea" font-size="11">After handoff (fallback)</text>
  <rect x="480" y="340" width="20" height="12" fill="#533483"/>
  <text x="510" y="351" fill="#eaeaea" font-size="11">Control (no handoff)</text>
</svg>
