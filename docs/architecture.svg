<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <text x="400" y="30" text-anchor="middle" fill="#eaeaea" font-size="18" font-weight="bold">Spillover Proxy Architecture</text>

  <!-- Client -->
  <rect x="50" y="60" width="120" height="50" rx="8" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <text x="110" y="90" text-anchor="middle" fill="#eaeaea" font-size="14">Client</text>

  <!-- Proxy -->
  <rect x="250" y="60" width="140" height="50" rx="8" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="320" y="90" text-anchor="middle" fill="#eaeaea" font-size="14">Proxy :8090</text>

  <!-- Primary -->
  <rect x="480" y="30" width="140" height="50" rx="8" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <text x="550" y="50" text-anchor="middle" fill="#eaeaea" font-size="14">Primary :8081</text>
  <text x="550" y="70" text-anchor="middle" fill="#888" font-size="11">Qwen3.6-35B-A3B</text>

  <!-- Fallback -->
  <rect x="480" y="110" width="140" height="50" rx="8" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <text x="550" y="130" text-anchor="middle" fill="#eaeaea" font-size="14">Fallback :8080</text>
  <text x="550" y="150" text-anchor="middle" fill="#888" font-size="11">Kev-4B-GGUF</text>

  <!-- Watcher -->
  <rect x="250" y="200" width="140" height="50" rx="8" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <text x="320" y="220" text-anchor="middle" fill="#eaeaea" font-size="14">Watcher</text>
  <text x="320" y="240" text-anchor="middle" fill="#888" font-size="11">VRAM pressure</text>

  <!-- VRAM -->
  <rect x="480" y="200" width="140" height="50" rx="8" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <text x="550" y="220" text-anchor="middle" fill="#eaeaea" font-size="14">VRAM</text>
  <text x="550" y="240" text-anchor="middle" fill="#888" font-size="11">2x A770 (32 GB)</text>

  <!-- Arrows -->
  <line x1="170" y1="85" x2="250" y2="85" stroke="#e94560" stroke-width="2"/>
  <polygon points="250,85 240,80 240,90" fill="#e94560"/>
  <text x="210" y="80" text-anchor="middle" fill="#aaa" font-size="11">chat</text>

  <line x1="390" y1="85" x2="480" y2="55" stroke="#0f3460" stroke-width="2"/>
  <polygon points="480,55 470,50 470,60" fill="#0f3460"/>
  <text x="440" y="60" text-anchor="middle" fill="#aaa" font-size="11">primary</text>

  <line x1="390" y1="85" x2="480" y2="135" stroke="#0f3460" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="480,135 470,130 470,140" fill="#0f3460"/>
  <text x="440" y="120" text-anchor="middle" fill="#aaa" font-size="11">fallback</text>

  <line x1="320" y1="200" x2="320" y2="160" stroke="#888" stroke-width="1"/>
  <text x="340" y="185" text-anchor="start" fill="#aaa" font-size="11">spill_enter / spill_leave</text>

  <line x1="320" y1="200" x2="480" y2="225" stroke="#888" stroke-width="1"/>
  <text x="400" y="220" text-anchor="middle" fill="#aaa" font-size="11">reads</text>
</svg>
